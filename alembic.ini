# ============================================================
# Alembic - configuracao de migrations do AdaptAI
# ============================================================
# A URL do banco NAO fica aqui (seria duplicar segredo). Ela e injetada em
# tempo de execucao pelo alembic/env.py a partir de app.core.config.settings,
# que ja le DATABASE_URL / MYSQL_* do ambiente (.env em dev, Railway em prod).
# ============================================================

[alembic]
# Local dos scripts de migration (relativo ao diretorio backend/)
script_location = alembic

# Garante que 'app' seja importavel ao rodar alembic de dentro de backend/
prepend_sys_path = .

# Formato do nome dos arquivos de versao: data + slug, facilita leitura cronologica
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Fuso para o timestamp do file_template
timezone = America/Belem

# sqlalchemy.url e definido em env.py (NAO colocar segredo aqui)
sqlalchemy.url =


# ============================================================
# Logging
# ============================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
